<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="宝可梦冠军 M-C 规则伤害计算器：单打/双打、0-32 能力点、常用配置与采用率，支持中文、日本語、English。">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#E7EBF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0F1B" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="冠军伤害计算">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>冠军伤害计算器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&text=%E5%86%A0%E5%86%9B%E4%BC%A4%E5%AE%B3%E8%AE%A1%E7%AE%97%E5%99%A8&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&text=%E3%83%81%E3%83%A3%E3%83%B3%E3%83%94%E3%82%AA%E3%82%BA%E3%83%80%E3%83%A1%E8%A8%88&display=swap">
<style>
/* Layout: broadcast matchup — 我方 (blue corner) | results + field | 对手 (red corner); on phones a sticky matchup bar switches between the three. */
:root{
  --bg:#E7EBF2; --panel:#FFFFFF; --panel2:#F1F4F9; --ink:#121A2E; --muted:#5A6580; --line:#D5DBE7;
  --gold:#F0B323; --gold-ink:#8A5A00; --gold-soft:#FCEFCD;
  --us:#2B67D8; --us-soft:#E2EBFB; --them:#CF3A32; --them-soft:#FAE4E2;
  --up:#D8432F; --down:#2F6FD8;
  --hp-hi:#22AE5B; --hp-mid:#E2A112; --hp-lo:#DD4337; --hp-track:#E3E7EF;
  --shadow:0 1px 2px rgba(18,26,46,.06),0 6px 20px rgba(18,26,46,.06);
  --f-num:"Barlow Condensed","DIN Alternate","Arial Narrow",sans-serif;
  --f-title:"ZCOOL QingKe HuangYou","PingFang SC","Microsoft YaHei",sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0F1B; --panel:#121A2B; --panel2:#19223A; --ink:#E8ECF6; --muted:#93A0BD; --line:#26314C;
  --gold:#F4C244; --gold-ink:#F4C244; --gold-soft:#3A2F12;
  --us:#6C9DFF; --us-soft:#17264A; --them:#FF6E63; --them-soft:#3B1B1F;
  --up:#FF7A66; --down:#6FA0FF;
  --hp-hi:#35C773; --hp-mid:#F0B42A; --hp-lo:#F0574B; --hp-track:#243050;
  --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0A0F1B; --panel:#121A2B; --panel2:#19223A; --ink:#E8ECF6; --muted:#93A0BD; --line:#26314C;
  --gold:#F4C244; --gold-ink:#F4C244; --gold-soft:#3A2F12;
  --us:#6C9DFF; --us-soft:#17264A; --them:#FF6E63; --them-soft:#3B1B1F;
  --up:#FF7A66; --down:#6FA0FF;
  --hp-hi:#35C773; --hp-mid:#F0B42A; --hp-lo:#F0574B; --hp-track:#243050;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}

.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}

/* header: title + language (row 1), format + rules + swap (row 2) */
.top{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px 12px;margin-bottom:12px}
.title{margin:0;font-family:var(--f-title);font-weight:400;font-size:28px;line-height:1.1;letter-spacing:.04em;text-wrap:balance;min-width:0}
.title span{color:var(--gold-ink)}
.title em{font-style:normal;color:inherit}
.title .nw{white-space:nowrap}
@media (max-width:480px){ html[lang="ja"] .title{font-size:21px} html[lang="en"] .title{font-size:26px} }
html[lang="ja"] .srow{grid-template-columns:72px 26px minmax(0,1fr) 26px 26px 40px}
html[lang="ja"] .srow .sl{font-size:12.5px;white-space:nowrap}
html[lang="ja"] .bst .bl{font-size:10.5px;white-space:nowrap}
html[lang="ja"] .title{font-family:"Dela Gothic One",var(--f-body);font-size:24px;letter-spacing:.02em}
html[lang="en"] .title{font-family:var(--f-num);font-weight:700;font-size:30px;letter-spacing:.02em;text-transform:uppercase}
html[lang="ja"] body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo","Noto Sans JP",system-ui,sans-serif}
html[lang="en"] body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
.seg.lang{justify-self:end;align-self:start;padding:2px;background:var(--panel)}
.seg.lang button{font-size:12.5px;padding:4px 9px;font-weight:600}
.seg.lang button[aria-pressed="true"]{background:var(--gold);color:#2a1c00;box-shadow:none}
.rules{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;min-width:0}
.seg.mode{padding:3px;background:var(--panel);border-color:var(--line)}
.seg.mode button{font-size:14px;padding:5px 16px;font-weight:700}
.seg.mode button[aria-pressed="true"]{background:var(--ink);color:var(--panel);box-shadow:none}
.rules span{font-size:12px;color:var(--muted);white-space:nowrap}
.rules span b{color:var(--ink);font-weight:600}
.swap{justify-self:end;align-self:end;flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.swap svg{width:16px;height:16px}

/* matchup bar */
.matchbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:6px 8px;margin-inline:-4px;padding-inline:4px}
.mb{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto;gap:6px;align-items:stretch}
.corner{min-width:0;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:6px 10px 7px;display:flex;flex-direction:column;gap:1px;position:relative;overflow:hidden}
.corner .cl{font-size:11px;font-weight:700;letter-spacing:.08em}
.corner.us .cl{color:var(--us)} .corner.them .cl{color:var(--them)}
.corner .cn{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.corner::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:transparent}
.corner.us[aria-selected="true"]{background:var(--us-soft);border-color:var(--us)} .corner.us[aria-selected="true"]::after{background:var(--us)}
.corner.them[aria-selected="true"]{background:var(--them-soft);border-color:var(--them)} .corner.them[aria-selected="true"]::after{background:var(--them)}
.vs{align-self:center;font-family:var(--f-num);font-weight:700;font-size:18px;color:var(--gold-ink);font-style:italic}
.fieldtab{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:0 12px;font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;min-width:52px}
.fieldtab small{font-weight:500;font-size:10.5px;color:var(--muted);max-width:64px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fieldtab[aria-selected="true"]{background:var(--gold-soft);border-color:var(--gold)}
.focus{margin-top:6px;display:flex;align-items:center;gap:8px;min-height:28px;font-size:12.5px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 10px}
.focus .fl{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.focus .fl b{color:var(--ink)}
.focus .fp{font-family:var(--f-num);font-weight:700;font-size:16px;white-space:nowrap}
.focus .hpbar{width:56px;flex:none}
.focus .ko{font-weight:700;white-space:nowrap;font-size:12.5px}

/* grid */
.grid{display:flex;flex-direction:column;gap:14px}
.center{display:contents}
#results{order:-1}
.panel{order:1;display:none}
body[data-tab="0"] #panel0, body[data-tab="1"] #panel1, body[data-tab="2"] #panel2{display:block}
@media (min-width:1000px){
  .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr) minmax(0,1fr);align-items:start;gap:16px}
  .center{display:flex;flex-direction:column;gap:16px}
  .panel{display:block!important}
  .side{order:0}
  .fieldtab,.focus{display:none}
  .mb{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}
  .corner{cursor:default}
}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.panel.card{padding:14px}
.side.us{border-top:3px solid var(--us)} .side.them{border-top:3px solid var(--them)}
.sec{padding-top:14px;margin-top:14px;border-top:1px dashed var(--line)}
.sec:first-child{border-top:0;margin-top:0;padding-top:0}
.sh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.sh h3{margin:0;font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--muted)}
.sh .act{border:0;background:none;color:var(--gold-ink);font-size:12.5px;font-weight:600;padding:2px 0}

/* species header */
.mon{display:flex;gap:12px;align-items:center}
.mono{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px;background:linear-gradient(135deg,var(--t1) 0 50%,var(--t2) 50% 100%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);text-shadow:0 1px 2px rgba(0,0,0,.35);position:relative}
.mono.sm{width:34px;height:34px;font-size:15px}
.mono .mg{position:absolute;right:-3px;bottom:-3px;background:var(--gold);color:#3a2600;font-size:9px;font-weight:800;border-radius:6px;padding:0 3px;text-shadow:none;line-height:14px}
.pick{flex:1;min-width:0;text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:3px}
.pick .pn{font-size:18px;font-weight:800;line-height:1.2;display:flex;align-items:center;gap:6px}
.pick .pn::after{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-3px);margin-left:2px}
.types{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.tc{display:inline-block;font-size:11px;font-weight:700;line-height:18px;padding:0 7px;border-radius:5px;color:#fff;background:var(--tc);white-space:nowrap}
.tc.lt{color:#1B1B1B}
.ubadge{font-size:11.5px;color:var(--gold-ink);background:var(--gold-soft);border-radius:5px;padding:0 6px;line-height:18px;font-weight:600}
.megarow{margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--gold-soft);border-radius:10px;padding:7px 10px}
.megarow .ml{font-size:13px;font-weight:600}
.megarow .ml small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.sw{position:relative;width:46px;height:28px;flex:none;border-radius:999px;border:0;background:var(--line);transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--gold)}
.sw[aria-checked="true"]::after{transform:translateX(18px)}

/* fields */
.cfg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld.full{grid-column:1/-1}
@media (max-width:480px){ .cfg{grid-template-columns:minmax(0,1fr)} }
.fld label,.fld .lb{font-size:11.5px;color:var(--muted);font-weight:600}
.ctl{width:100%;min-width:0;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 10px;text-align:left;display:flex;align-items:center;gap:6px;min-height:40px;font-size:14px}
select.ctl{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:26px}
.ctl .cv{flex:0 1 auto;min-width:2.5em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ctl .pct{flex:none}
.pct{font-family:var(--f-num);font-weight:600;font-size:13px;color:var(--gold-ink);background:var(--gold-soft);border-radius:5px;padding:0 5px;line-height:18px}
.ctl .nm{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;text-align:right;font-size:11.5px;color:var(--muted);white-space:nowrap}
.ctl .nm .u{color:var(--up)} .ctl .nm .d{color:var(--down)}
.helper{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 10px;font-size:12.5px;white-space:nowrap}
.chip.gold{border-color:var(--gold);background:var(--gold-soft);color:var(--gold-ink);font-weight:600}
.chip .num{font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.note{font-size:11.5px;color:var(--muted)}

/* stat points */
.spt{font-size:12px;color:var(--muted)}
.spt b{font-family:var(--f-num);font-size:16px;color:var(--ink)}
.spt.over b{color:var(--hp-lo)}
.srow{display:grid;grid-template-columns:44px 26px minmax(0,1fr) 26px 26px 40px;align-items:center;gap:6px;height:40px}
.srow .sl{font-weight:700;font-size:13px;line-height:1.05}
.srow .sl small{display:block;font-weight:500;font-size:10.5px;color:var(--muted);font-family:var(--f-num)}
.srow .sl.u{color:var(--up)} .srow .sl.d{color:var(--down)}
@keyframes bump{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.spt.bump{animation:bump .28s ease}
.spt.bump b,.spt.full b{color:var(--gold-ink)}
.step{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;font-weight:700;font-size:15px;line-height:1;padding:0}
.srow .sv{font-family:var(--f-num);font-weight:600;font-size:16px;text-align:center;color:var(--muted)}
.srow .sv.on{color:var(--gold-ink)}
.srow .st{font-family:var(--f-num);font-weight:700;font-size:20px;text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--gold) 0 var(--p,0%),var(--hp-track) var(--p,0%) 100%)}
input[type=range]::-moz-range-track{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--gold) 0 var(--p,0%),var(--hp-track) var(--p,0%) 100%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--gold);margin-top:-8px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--gold)}

/* moves */
.moves{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mslot{min-width:0;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:7px 9px;text-align:left;display:flex;flex-direction:column;gap:3px;border-left:4px solid var(--tc,var(--line))}
.mslot .mn{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mslot .mm{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.mslot.empty .mn{color:var(--muted);font-weight:500}

/* boosts/status */
.boosts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.bst{display:flex;flex-direction:column;align-items:center;gap:3px;border:1px solid var(--line);border-radius:10px;padding:5px 2px;background:var(--panel2)}
.bst .bl{font-size:11px;color:var(--muted);font-weight:600}
.bst .bc{display:flex;align-items:center;gap:2px}
.bst .bv{font-family:var(--f-num);font-weight:700;font-size:16px;min-width:22px;text-align:center}
.bst .bv.pos{color:var(--up)} .bst .bv.neg{color:var(--down)}
.bst .step{width:22px;height:22px;border-radius:6px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.hprow{display:grid;grid-template-columns:auto minmax(0,1fr) 56px;gap:10px;align-items:center}
.hprow .num{font-weight:700;font-size:18px;text-align:right}

/* results */
.results{padding:12px 12px 6px}
.rhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.rhead h2{margin:0;font-size:15px;font-weight:800}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--panel2)}
.seg button{border:0;background:none;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.speed{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);background:var(--panel2);border-radius:10px;padding:6px 10px;margin-bottom:8px;flex-wrap:wrap}
.speed b{color:var(--ink);font-family:var(--f-num);font-size:15px}
.speed .who{margin-left:auto;font-weight:700;color:var(--ink)}
.dirblock + .dirblock{margin-top:10px}
.dirhead{display:none;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin:4px 2px 6px}
.dirhead i{font-style:normal;color:var(--ink)}
body[data-dir="0"] .dirblock[data-d="1"], body[data-dir="1"] .dirblock[data-d="0"]{display:none}
@media (min-width:1000px){ .dirblock{display:block!important} .dirhead{display:block} .rhead .seg{display:none} }
.mrow{border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0}
.mbtn{width:100%;border:0;background:none;text-align:left;padding:9px 2px 10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center}
.mbtn .mt{display:flex;align-items:center;gap:6px;min-width:0}
.mbtn .mt b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px}
.mbtn .mi{font-size:11.5px;color:var(--muted);white-space:nowrap}
.mbtn .dmg{text-align:right;font-family:var(--f-num);font-weight:700;font-size:20px;line-height:1.1;white-space:nowrap}
.mbtn .ko{text-align:right;font-size:12px;font-weight:600;white-space:nowrap}
.ko.k1{color:var(--hp-lo)} .ko.k2{color:var(--gold-ink)} .ko.k0{color:var(--muted)}
.mbtn .hpbar{grid-column:1/-1;margin-top:5px}
.mrow.focus-on .mbtn{background:linear-gradient(90deg,var(--gold-soft),transparent 70%);border-radius:8px}
.hpbar{position:relative;height:8px;border-radius:5px;background:var(--hp-track);overflow:hidden}
.hpbar .left{position:absolute;left:0;top:0;bottom:0;background:var(--hpc)}
.hpbar .range{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(-45deg,var(--hpc) 0 3px,transparent 3px 6px);opacity:.75}
.detail{padding:0 2px 12px;display:flex;flex-direction:column;gap:8px}
.detail .desc{font-size:12.5px;color:var(--muted);line-height:1.5}
.detail .desc b{color:var(--ink);font-weight:600}
.rolls{font-family:var(--f-num);font-size:13.5px;color:var(--muted);word-break:break-word;line-height:1.5}
.rolls span{display:inline-block;min-width:2.1em}
.dopts{display:flex;gap:6px;flex-wrap:wrap}
.empty-note{padding:14px 2px;color:var(--muted);font-size:13px}

/* field */
.fgroup{display:flex;flex-direction:column;gap:6px}
.fgroup + .fgroup{margin-top:12px}
.fgroup .lb{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.06em}
.sidecols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sidecol{border-radius:10px;padding:8px;background:var(--panel2)}
.sidecol h4{margin:0 0 6px;font-size:12px}
.sidecol.us h4{color:var(--us)} .sidecol.them h4{color:var(--them)}
.sidecol .chips{gap:5px}
.sidecol .chip{font-size:12px;padding:3px 8px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(6,10,20,.45);z-index:40;opacity:0;transition:opacity .18s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--panel);border-radius:18px 18px 0 0;max-height:86vh;display:flex;flex-direction:column;transform:translateY(102%);transition:transform .22s ease;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -8px 30px rgba(0,0,0,.2)}
.sheet.on{transform:none}
@media (min-width:700px){ .sheet{left:50%;right:auto;bottom:auto;top:50%;width:560px;border-radius:18px;max-height:78vh;transform:translate(-50%,-46%);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s} .sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto} }
.shd{padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.shd .row1{display:flex;align-items:center;justify-content:space-between}
.shd h3{margin:0;font-size:16px}
.shd .x{border:0;background:var(--panel2);border-radius:999px;width:32px;height:32px;font-size:18px;line-height:1}
.search{width:100%;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:9px 12px;font-size:16px}
.sbody{overflow:auto;-webkit-overflow-scrolling:touch;padding:4px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.sgh{position:sticky;top:0;background:var(--panel);font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--muted);padding:10px 0 6px;z-index:1}
.opt{width:100%;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 2px}
.opt .om{min-width:0;display:flex;flex-direction:column;gap:2px}
.opt .om b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt .om small{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt .os{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.opt[aria-current="true"] .om b{color:var(--gold-ink)}
.ubar{width:64px;height:4px;border-radius:3px;background:var(--hp-track);overflow:hidden}
.ubar i{display:block;height:100%;background:var(--gold)}
.natgrid{display:grid;grid-template-columns:42px repeat(5,minmax(0,1fr));gap:4px;padding-top:8px}
.natgrid .hd{font-size:11px;font-weight:700;text-align:center;color:var(--muted);align-self:center}
.natgrid .hd.u{color:var(--up)} .natgrid .hd.d{color:var(--down)}
.natgrid button{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:8px 0;font-size:13px;font-weight:600}
.natgrid button.neutral{color:var(--muted);font-weight:500}
.natgrid button[aria-current="true"]{background:var(--gold);border-color:var(--gold);color:#2a1c00}
.nathint{font-size:12px;color:var(--muted);margin-top:10px}

footer.src{margin-top:18px;font-size:11.5px;color:var(--muted);line-height:1.7}
footer.src a{color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

      const rd = res.r && res.r.rawDesc ? res.r.rawDesc : {};
      const mType = rd.moveType || (rm ? rm.type : md.type), mBP = rd.moveBP || (rm && rm.bp) || md.basePower;
      const on = S.focus.d === d && S.focus.s === k;
      const meta = `${cat[md.category]}${md.category !== 'Status' ? ' · ' + t('power', mBP || '—') : ''}${res.spread ? ' · ' + (S.field.spreadBoth ? t('spreadTag') : t('spreadSingle')) : ''}${S.sides[d].crit[k] ? ' · ' + t('critTag') : ''}`;
      h += `<div class="mrow${on ? ' focus-on' : ''}"><button class="mbtn" type="button" data-act="row" data-d="${d}" data-k="${k}" aria-expanded="${S.open.d === d && S.open.s === k}">` +
        `<span class="mt">${typeChip(mType)}<b>${esc(MOVE_N(res.name))}</b></span>` +
        `<span class="dmg">${res.status ? '<span class="note">—</span>' : res.error ? `<span class="note">${t('cannotCalc')}</span>` : res.hi === 0 ? '<span class="note">0%</span>' : `${fmt(res.loP)}–${fmt(res.hiP)}%`}</span>` +
        `<span class="mi">${meta}</span><span class="ko ${ko.c}">${ko.t}</span>${res.hi === 0 ? '' : hpBar(res)}</button>`;
      if (S.open.d === d && S.open.s === k) {
        h += '<div class="detail">';
        if (res.status) h += `<div class="desc">${t('statusDesc')}</div>`;
        else if (res.error) h += `<div class="desc">${t('calcError', esc(res.error))}</div>`;
        else {
          h += `<div class="desc">${esc(descLocal(res))}: <b class="num">${res.lo}–${res.hi}</b> (<b class="num">${fmt(res.loP)}%–${fmt(res.hiP)}%</b>) · ${t('targetHP')} <span class="num">${res.cur}/${res.maxHP}</span></div>`;
          h += `<div class="rolls" aria-label="${t('rollsAria')}">${res.rolls.map(x => `<span>${x}</span>`).join(' ')}</div>`;
        }
        h += `<div class="dopts"><button class="chip" type="button" data-act="crit" data-d="${d}" data-k="${k}" aria-pressed="${!!S.sides[d].crit[k]}">${t('critBtn')}</button>`;
        if (res.spread) h += `<button class="chip" type="button" data-act="spread" aria-pressed="${S.field.spreadBoth}">${t('bothTargets')}</button>`;
        h += '</div></div>';
      }
      h += '</div>';
    });
    h += '</div>';
  }
  $('results').innerHTML = h;
  renderFocus();
}
function renderFocus() {
  const {d, s} = S.focus;
  const res = RES[d] && RES[d][s];
  const el = $('focus');
  if (!res) { el.innerHTML = `<span class="fl">${t('focusHint')}</span>`; return; }
  const ko = koText(res);
  const dn = spName(formOf(S.sides[1 - d]));
  const ks = koShort(res);
  el.innerHTML = `<span class="fl"><b>${esc(MOVE_N(res.name))}</b> → ${esc(dn)}</span>` + (ks ? `<span class="ko ${ko.c}">${ks}</span>` : res.status ? `<span class="ko k0">${t('statusShort')}</span>` : '') +
    (res.loP !== undefined && res.hi > 0 ? `<span class="fp">${fmt(res.loP)}–${fmt(res.hiP)}%</span>${hpBar(res)}` : '');
}
function renderAll() { renderTabs(); renderSide(0); renderSide(1); renderField(); renderResults(); save(); }
function refreshStats(i) {
  const s = S.sides[i], st = statsOf(s), tot = spTotal(s);
  for (const k of STATS) {
    const r = $('sp' + i + k); if (r) { r.value = s.sp[k]; r.style.setProperty('--p', s.sp[k] / 32 * 100 + '%'); }
    const sv = $('sv' + i + k); if (sv) { sv.textContent = s.sp[k]; sv.classList.toggle('on', !!s.sp[k]); }
    const el = $('st' + i + k); if (el) el.textContent = st[k];
  }
  const sp = $('spt' + i); if (sp) { sp.innerHTML = t('spLeft', 66 - tot); sp.classList.toggle('over', tot > 66); sp.classList.toggle('full', tot >= 66); }
  const ha = $('hpabs' + i); if (ha) ha.textContent = `${Math.max(1, Math.round(st.hp * s.hp / 100))}/${st.hp}`;
  renderResults(); save();
}
function setSP(i, k, v) {
  const s = S.sides[i];
  const others = spTotal(s) - s.sp[k];
  const want = Math.max(0, Math.min(32, v));
  s.sp[k] = Math.min(want, 66 - others);
  if (want > s.sp[k]) {
    const el = $('spt' + i);
    if (el) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
  }
}

// ---------- bottom sheet ----------
let sheet = null;
function openSheet(cfg) {
  sheet = cfg;
  $('sheetTitle').textContent = cfg.title;
  const inp = $('sheetSearch');
  inp.value = '';
  inp.hidden = !cfg.search;
  drawSheet();
  $('scrim').hidden = false; $('sheet').hidden = false;
  requestAnimationFrame(() => { $('scrim').classList.add('on'); $('sheet').classList.add('on'); });
  $('sheetBody').scrollTop = 0;
  if (cfg.search && window.matchMedia('(min-width:700px)').matches) setTimeout(() => inp.focus(), 60);
}
function closeSheet() {
  sheet = null;
  $('scrim').classList.remove('on'); $('sheet').classList.remove('on');
  setTimeout(() => { if (!sheet) { $('scrim').hidden = true; $('sheet').hidden = true; } }, 230);
}
function drawSheet() { if (sheet) $('sheetBody').innerHTML = sheet.render(normQ($('sheetSearch').value)); }
// every name is searchable in all three languages (plus pinyin), whatever the display language
const matches = (q, label, key) => !q || toHira(label.toLowerCase()).includes(q) || (key && key.includes(q));
function optRow(v, left, title, sub, right, current) {
  return `<button class="opt" type="button" data-pick="${esc(v)}"${current ? ' aria-current="true"' : ''}>${left || '<span></span>'}<span class="om"><b>${title}</b>${sub ? `<small>${sub}</small>` : ''}</span><span class="os">${right || ''}</span></button>`;
}
const ubar = p => (p === undefined ? '' : `<span class="pct">${fmt(p)}%</span><span class="ubar"><i style="width:${Math.min(100, p)}%"></i></span>`);

function speciesSheet(i) {
  openSheet({
    title: t('pickSpecies', i ? t('them') : t('us')), search: true,
    render(q) {
      const cur = formOf(S.sides[i]);
      const rk = s => (isS() ? (s.rs ? `<span class="pct">#${s.rs}</span>` : '') : (s.r ? `<span class="pct">#${s.r[0]} · ${fmt(s.r[1])}%</span>` : ''));
      const row = s => optRow(s.n, mono(s.n, true), esc(spName(s.n)), s.t.map(TYPE_N).join(' · ') + ' · ' + t('bst', s.b.reduce((a, b) => a + b, 0)), rk(s), s.n === cur);
      if (q) {
        const list = D.species.filter(s => matches(q, spName(s.n), s.p)).slice(0, 80);
        return list.length ? list.map(row).join('') : `<p class="empty-note">${t('noSpecies')}</p>`;
      }
      const top = isS() ? D.species.filter(s => s.rs).sort((a, b) => a.rs - b.rs) : D.species.filter(s => s.r).sort((a, b) => a.r[0] - b.r[0]);
      const all = D.species.filter(s => !s.m);
      return `<div class="sgh">${t('topGroup', modeName())}</div>${top.map(row).join('')}<div class="sgh">${t('allGroup', all.length)}</div>${all.map(row).join('')}`;
    },
    pick(v) {
      const sp = SP[v];
      const side = newSide(sp.m || v);
      if (sp.m) { const st = (SP[sp.m].x || []).find(x => x[1] === v); if (st) { side.item = st[0]; side.mega = true; } }
      side.hp = 100;
      S.sides[i] = side;
      autoField(side);
      S.open = {d: -1, s: -1};
      renderAll();
    },
  });
}
function itemSheet(i) {
  const s = S.sides[i];
  openSheet({
    title: t('itemTitle'), search: true,
    render(q) {
      const u = usageOf(s.base);
      const used = new Set();
      let h = '';
      const ok = n => matches(q, ITEM_N(n), D.items[n][1]);
      const row = (n, p) => optRow(n, '', esc(ITEM_N(n)), '', ubar(p), n === s.item);
      if (!q) h += optRow('', '', t('noItemOpt'), '', '', !s.item);
      if (u) {
        const l = u.items.filter(([n]) => D.items[n] && ok(n));
        if (l.length) h += `<div class="sgh">${t('common', modeName())}</div>` + l.map(([n, p]) => { used.add(n); return row(n, p); }).join('');
      }
      const stones = (SP[s.base].x || []).map(x => x[0]).filter(n => !used.has(n) && ok(n));
      if (stones.length) { h += `<div class="sgh">${t('stones')}</div>` + stones.map(n => { used.add(n); return row(n); }).join(''); }
      const rest = Object.keys(D.items).filter(n => !used.has(n) && !D.stoneForm[n] && ok(n)).sort((a, b) => COLL.compare(ITEM_N(a), ITEM_N(b)));
      if (rest.length) h += `<div class="sgh">${t('allItems')}</div>` + rest.map(n => row(n)).join('');
      return h || `<p class="empty-note">${t('noItemFound')}</p>`;
    },
    pick(v) {
      s.item = v;
      const sf = D.stoneForm[v];
      s.mega = !!(sf && sf[0] === s.base);
      autoField(s);
      renderAll();
    },
  });
}
function moveSheet(i, k) {
  const s = S.sides[i];
  const cat = t('cat');
  openSheet({
    title: t('moveTitle', k + 1), search: true,
    render(q) {
      const u = usageOf(s.base), used = new Set(), cur = s.moves[k];
      const ok = n => matches(q, MOVE_N(n), D.moves[n][1]);
      const row = (n, p) => {
        const md = moveData(n);
        if (!md) return '';
        const sub = `${cat[md.category]}${md.category !== 'Status' ? ' · ' + t('power', md.basePower || '—') : ''}${!isS() && isSpreadMove(md) ? ' · ' + t('spreadTag') : ''}`;
        return optRow(n, typeChip(md.type), esc(MOVE_N(n)), sub, ubar(p), n === cur);
      };
      let h = q ? '' : optRow('', '', t('clearSlot'), '', '', !cur);
      if (u) {
        const l = u.moves.filter(([n]) => D.moves[n] && ok(n));
        if (l.length) h += `<div class="sgh">${t('common', modeName())}</div>` + l.map(([n, p]) => { used.add(n); return row(n, p); }).join('');
      }
      const ls = learnable(s.base).filter(n => !used.has(n) && ok(n));
      ls.sort((a, b) => { const x = moveData(a), y = moveData(b); return ((y.category !== 'Status') - (x.category !== 'Status')) || ((y.basePower || 0) - (x.basePower || 0)) || COLL.compare(MOVE_N(a), MOVE_N(b)); });
      if (ls.length) { h += `<div class="sgh">${t('learnable', ls.length)}</div>` + ls.map(n => row(n)).join(''); ls.forEach(n => used.add(n)); }
      if (q) {
        const other = D.moveList.filter(n => !used.has(n) && ok(n)).slice(0, 40);
        if (other.length) h += `<div class="sgh">${t('otherMoves')}</div>` + other.map(n => row(n)).join('');
      }
      return h || `<p class="empty-note">${t('noMove')}</p>`;
    },
    pick(v) { s.moves[k] = v; s.crit[k] = false; renderAll(); },
  });
}
function natureSheet(i) {
  const s = S.sides[i];
  const order = ['atk', 'def', 'spa', 'spd', 'spe'];
  const byMods = {};
  for (const [n, v] of Object.entries(D.natures)) byMods[(v[1] || 'x') + '|' + (v[2] || 'x')] = n;
  const neutral = ['Hardy', 'Docile', 'Bashful', 'Quirky', 'Serious'];
  openSheet({
    title: t('natTitle'), search: false,
    render() {
      const u = usageOf(s.base);
      let h = '';
      if (u && u.natures && u.natures.length) {
        h += `<div class="sgh">${t('commonNat', modeName())}</div>` + u.natures.map(([n, p]) => {
          const m = natMods(n);
          return optRow(n, '', esc(NAT_N(n)), m.up && m.up !== m.down ? `↑${STAT_N(m.up)} ↓${STAT_N(m.down)}` : t('neutral'), ubar(p), n === s.nature);
        }).join('') + `<div class="sgh">${t('allNat')}</div>`;
      }
      h += '<div class="natgrid"><span></span>' + order.map(k => `<span class="hd d">↓${STAT_N(k)}</span>`).join('');
      order.forEach((up, r) => {
        h += `<span class="hd u">↑${STAT_N(up)}</span>`;
        order.forEach((down, c) => {
          const n = r === c ? neutral[r] : byMods[up + '|' + down];
          h += `<button type="button" data-pick="${n}" class="${r === c ? 'neutral' : ''}"${n === s.nature ? ' aria-current="true"' : ''}>${esc(NAT_N(n))}</button>`;
        });
      });
      return h + `</div><p class="nathint">${t('natHint')}</p>`;
    },
    pick(v) { s.nature = v; renderAll(); },
  });
}

// ---------- events ----------
document.addEventListener('click', e => {
  const pickEl = e.target.closest('[data-pick]');
  if (pickEl && sheet) { const cfg = sheet; closeSheet(); cfg.pick(pickEl.dataset.pick); return; }
  const el = e.target.closest('[data-act],[data-tab]');
  if (!el) return;
  if (el.dataset.tab !== undefined && !el.dataset.act) {
    S.tab = +el.dataset.tab; renderTabs(); save();
    if (window.matchMedia('(max-width:999px)').matches) window.scrollTo({top: Math.min(window.scrollY, $('results').offsetTop + $('results').offsetHeight - 120), behavior: 'smooth'});
    return;
  }
  const i = +el.dataset.i, k = el.dataset.k, v = el.dataset.v;
  const s = S.sides[i];
  switch (el.dataset.act) {
    case 'lang': setLang(v); break;
    case 'mode': setMode(v); break;
    case 'species': speciesSheet(i); break;
    case 'item': itemSheet(i); break;
    case 'nature': natureSheet(i); break;
    case 'move': moveSheet(i, +k); break;
    case 'mega': s.mega = !s.mega; autoField(s); renderAll(); break;
    case 'usual': applyUsual(s); autoField(s); renderAll(); break;
    case 'spreadset': {
      const u = usageOf(s.base), sp2 = u.spreads[+k][0];
      for (const x of STATS) s.sp[x] = Math.min(32, sp2[x] || 0);
      s.nature = bestNature(u.natures, sp2, s.nature);
      renderAll(); break;
    }
    case 'set': { const st = D.sets[s.base][+k]; s.nature = D.natures[st.nature] ? st.nature : s.nature; for (const x of STATS) s.sp[x] = Math.min(32, st.sp[x] || 0); if (st.ability && SP[s.base].a.includes(st.ability)) s.ability = st.ability; renderAll(); break; }
    case 'abon': s.abOn = !s.abOn; renderAll(); break;
    case 'spclear': for (const x of STATS) s.sp[x] = 0; refreshStats(i); break;
    case 'spstep': setSP(i, k, s.sp[k] + +v); refreshStats(i); break;
    case 'boost': s.boosts[k] = Math.max(-6, Math.min(6, s.boosts[k] + +v)); renderSide(i); renderResults(); save(); break;
    case 'bclear': for (const x in s.boosts) s.boosts[x] = 0; renderSide(i); renderResults(); save(); break;
    case 'status': s.status = v; renderSide(i); renderResults(); save(); break;
    case 'weather': S.field.weather = v; renderTabs(); renderField(); renderResults(); save(); break;
    case 'terrain': S.field.terrain = v; renderTabs(); renderField(); renderResults(); save(); break;
    case 'spread': S.field.spreadBoth = !S.field.spreadBoth; renderField(); renderResults(); save(); break;
    case 'tr': S.field.trickRoom = !S.field.trickRoom; renderField(); renderResults(); save(); break;
    case 'gravity': S.field.gravity = !S.field.gravity; renderField(); renderResults(); save(); break;
    case 'sidefx': S.field.sides[i][k] = !S.field.sides[i][k]; renderField(); renderResults(); save(); break;
    case 'dir': S.dir = +v; S.focus = {d: +v, s: S.focus.s}; renderTabs(); renderResults(); save(); break;
    case 'row': {
      const d = +el.dataset.d, kk = +k;
      const same = S.open.d === d && S.open.s === kk;
      S.open = same ? {d: -1, s: -1} : {d, s: kk};
      S.focus = {d, s: kk};
      renderResults(); save(); break;
    }
    case 'crit': { const d = +el.dataset.d; S.sides[d].crit[+k] = !S.sides[d].crit[+k]; renderResults(); save(); break; }
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'sheetSearch') { drawSheet(); return; }
  if (el.dataset.act === 'sp') { const i = +el.dataset.i; setSP(i, el.dataset.k, +el.value); refreshStats(i); }
  if (el.dataset.act === 'hp') {
    const i = +el.dataset.i; S.sides[i].hp = +el.value;
    el.style.setProperty('--p', el.value + '%');
    $('hpv' + i).textContent = el.value + '%';
    refreshStats(i);
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.act === 'ability') { const s = S.sides[+el.dataset.i]; s.ability = el.value; s.abOn = false; autoField(s); renderAll(); }
});
$('sheetClose').addEventListener('click', closeSheet);
$('scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheet) closeSheet(); });
$('swapBtn').addEventListener('click', () => {
  S.sides.reverse(); S.field.sides.reverse();
  S.open = {d: -1, s: -1};
  renderAll();
});

// ---------- boot ----------
APP = load();
LANG = APP.lang;
COLL = new Intl.Collator(LANGS[LANG]);
S = APP[APP.mode];
renderChrome();
renderAll();
window.__champCalc = {get APP() { return APP; }, get S() { return S; }, calcMove, statsOf, speedOf, koText, descLocal, newSide, renderAll, setMode, setLang};
})();
</script>
<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
</body>
